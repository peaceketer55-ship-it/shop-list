
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shopping List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>My Shopping List</h1>
    <p>Plan your shopping and track your spending.</p>

    <form id="shopping-form">
      <input id="item-name" type="text" placeholder="Item name" required>
      <input id="item-price" type="number" placeholder="Price (KSh)"
             min="0.01" step="0.01" required>
      <button type="submit">Add Item</button>
    </form>

    <div class="actions">
      <button id="mark-button" type="button">Mark Purchased</button>
      <button id="clear-button" type="button">Clear List</button>
    </div>

    <p id="selected-item">Selected item: None</p>
    <ul id="shopping-list"></ul>
    <h2>Total Purchased: KSh <span id="total">0.00</span></h2>
    <p id="message" aria-live="polite"></p>
  </main>
</body>
</html>
